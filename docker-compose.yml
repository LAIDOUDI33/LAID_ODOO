# ============================================================
# HASSIBA Suite ERP v2.0.0 - Docker Compose Stack
# Production-ready container orchestration
# ============================================================

version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hassiba-suite
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/custom.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - hassiba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (for production)
  postgres:
    image: postgres:16-alpine
    container_name: hassiba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hassiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hassiba_secure_2024}
      POSTGRES_DB: ${POSTGRES_DB:-hassiba_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - hassiba-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hassiba-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hassiba-network

  # MinIO Object Storage (for documents/files)
  minio:
    image: minio/minio:latest
    container_name: hassiba-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - hassiba-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hassiba-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - hassiba-network

  # Backup Service
  backup:
    image: alpine:latest
    container_name: hassiba-backup
    restart: "no"
    volumes:
      - postgres_data:/data/postgres:ro
      - ./backups:/backups
    entrypoint: |
      sh -c "
        tar czf /backups/hassiba-db-$(date +%Y%m%d_%H%M%S).tar.gz -C /data/postgres . &&
        echo 'Backup completed successfully'
      "
    networks:
      - hassiba-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  hassiba-network:
    driver: bridge
